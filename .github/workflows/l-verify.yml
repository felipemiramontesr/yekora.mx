name: L verify
on:
  push:
    branches: [main, master]
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Protocol L structural verify
        run: |
          if [ -f scripts/verifyL.mjs ]; then node scripts/verifyL.mjs; else echo "verifyL not installed (tools module off)"; fi
