name: 🚀 Yekora Deployment

# Single CI workflow (FC 001): same job graph as Archon's deploy.yml, with Yekora's own
# stack inside each job (Next.js + Bun + Vitest + Playwright). One job per piece of work, each
# named for what it runs (FC 025, FC 026): static analysis, dependency audit, Frontend (site),
# CI tooling, Backend (the API, no database), Database (migrations and the API's real SQL on
# MariaDB 11.8.9, as production), secret scan, SonarQube, and E2E on three browsers plus a
# real-stack lane. Every verification job starts at t = 0; only the certification waits for
# them. Applying migrations to production lives in db-migrations.yml.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # FC 029 T2.5 (321_AN, option A): «Publicar cambios» of the catalog backoffice dispatches the
  # whole pipeline on main, so a publication passes every gate before the store is rebuilt.
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read
  checks: write
  statuses: write
  pull-requests: write

# FC 026: a newer push to a pull request cancels the older run of that pull request. On main
# every push keeps its own group (run_id), so no deploy run is ever cancelled or replaced.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  static-analysis:
    name: 🧹 Static Analysis (ESLint · TypeScript · TSDoc)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: '24'
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.3.14'
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Lint (ESLint + SonarJS)
        run: bun run lint
      - name: Type Check (TypeScript)
        # Real error count for the dashboard; the step still fails when ERRORS > 0.
        run: |
          set +e
          bun run typecheck > tsc-output.txt 2>&1
          TSC_EXIT=$?
          cat tsc-output.txt
          ERRORS=$(grep -c "error TS" tsc-output.txt || true)
          echo "{\"errors\": ${ERRORS:-0}, \"warnings\": 0}" > tsc-result.json
          exit $TSC_EXIT
      - name: Upload TSC Result
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: tsc-result
          path: tsc-result.json
      - name: TSDoc Coverage (blocking — every exported declaration documented)
        run: bun run check:tsdoc
      - name: Platform guards (static export, SPA fallbacks, mail only through the outbox)
        # FC 027 T2.4/T2.5 (ADR 0011, ADR 0013), over the committed sources.
        run: bun scripts/checkPlatformGuards.ts

  dependency-audit:
    name: 📦 Dependency Audit (zero advisories, every severity)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # Every push and pull request; Dependabot (PRs) and dependency-audit-cron.yml (daily) stay.
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: '24'
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.3.14'
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Security Audit (blocking — zero advisories of any severity)
        run: bun scripts/dependencyAuditGate.ts

  frontend-validation:
    name: 🎨 Frontend (Next.js) Verification
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: '24'
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.3.14'
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Site tests (app, components, lib)
        id: frontend_tests
        run: bunx vitest run --config vitest.frontend.config.ts
      - name: Publish Test Report
        uses: mikepenz/action-junit-report@d9f48fc87bc235f7e214acf696ca5abc0a986f16 # v6
        # Only when the tests ran: if an earlier step failed there is no XML.
        if: always() && steps.frontend_tests.outcome != 'skipped'
        with:
          report_paths: 'test-results.xml'
          detailed_summary: true
          include_passed: true
      - name: Upload Test Results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always() && steps.frontend_tests.outcome != 'skipped'
        with:
          name: frontend-results
          path: test-results.xml

  tooling-validation:
    name: 🧰 CI Tooling Verification
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: '24'
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.3.14'
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Tooling tests (gates, migrator, certification)
        id: tooling_tests
        run: bunx vitest run --config vitest.tooling.config.ts
      - name: Publish Test Report
        uses: mikepenz/action-junit-report@d9f48fc87bc235f7e214acf696ca5abc0a986f16 # v6
        # Only when the tests ran: if an earlier step failed there is no XML.
        if: always() && steps.tooling_tests.outcome != 'skipped'
        with:
          report_paths: 'test-results.xml'
          detailed_summary: true
          include_passed: true
      - name: Upload Test Results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always() && steps.tooling_tests.outcome != 'skipped'
        with:
          name: tooling-results
          path: test-results.xml

  backend-validation:
    name: 🛡️ Backend (API) Verification
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: '24'
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.3.14'
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Build API bundle (apps/api, esbuild → dist/index.js)
        # Proves the Hostinger entry point bundles; api-release publishes the same build.
        run: bun run --cwd apps/api build
      - name: Q03 API contract (OpenAPI 3.1 in sync, no breaking change, every route with a permission)
        # FC 027 T2.2/T2.6: apps/api/src/contract.ts against the committed apps/api/openapi.json.
        run: bun scripts/checkApiContract.ts
      - name: API unit tests (100 % coverage of apps/api, no database)
        id: api_tests
        run: bunx vitest run --config vitest.backend.config.ts --coverage
      - name: Publish Test Report
        uses: mikepenz/action-junit-report@d9f48fc87bc235f7e214acf696ca5abc0a986f16 # v6
        if: always() && steps.api_tests.outcome != 'skipped'
        with:
          report_paths: 'test-results.xml'
          detailed_summary: true
          include_passed: true
      - name: Upload Backend Artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always() && steps.api_tests.outcome != 'skipped'
        with:
          name: backend-results
          path: test-results.xml

  database-validation:
    name: 🏛️ Database (SQL) Verification
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # Production's engine (SELECT VERSION() = 11.8.9-MariaDB-log, measured by Ω on 2026-10-30), in a
    # throwaway service: no self-hosted runner and no production secret ever reach this job.
    services:
      mariadb:
        image: mariadb:11.8.9
        env:
          MARIADB_ROOT_PASSWORD: ci-only-root
          MARIADB_DATABASE: yekora_ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=24
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: '3306'
      DB_USER: root
      DB_PASSWORD: ci-only-root
      DB_NAME: yekora_ci
      # Fingerprint after 001–006 (FC 029 F0), measured on yekora_dev; production must match it
      # once 006 is applied with db-migrations.yml (Rule 23). After 001–005 it was 4dc9d3df….
      EXPECTED_FINGERPRINT: fa8a845a1c60318edeaab1a7f8d1ba87 (526 elementos)
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.3.14'
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Migrations from scratch (001–006) with their verify counters
        run: |
          set -euo pipefail
          bun scripts/migrateDb.ts | tee migrate.log
          for n in 001 002 003 004 005 006; do
            grep -q "^\[VERIFY\] $n " migrate.log || { echo "FATAL: no [VERIFY] $n"; exit 1; }
          done
      - name: Idempotency (DB_LAW) — a second run applies nothing
        run: |
          set -euo pipefail
          bun scripts/migrateDb.ts | tee rerun.log
          grep -q '^\[SKIP\] nothing to apply' rerun.log
          grep -q '^\[OK\] migrations: 0 applied' rerun.log
      - name: Schema fingerprint equals production's (Rule 23)
        run: bun scripts/dbParityCheck.ts --expect "$EXPECTED_FINGERPRINT"
      - name: Reversibility — down 006, 005, 004, 003, 002, 001, then up again with the same fingerprint
        run: |
          set -euo pipefail
          for n in 006 005 004 003 002 001; do bun scripts/migrateDb.ts --down "$n"; done
          bun scripts/migrateDb.ts --plan | tee plan.log
          grep -q '^\[PLAN\] tables=1$' plan.log || { echo "FATAL: business tables left after the rollback"; exit 1; }
          bun scripts/migrateDb.ts
          bun scripts/dbParityCheck.ts --expect "$EXPECTED_FINGERPRINT"
      - name: Real SQL of the API (catalog, quote, checkout, webhooks, constraints)
        id: db_tests
        run: bunx vitest run --config vitest.db.config.ts
      - name: Publish Test Report
        uses: mikepenz/action-junit-report@d9f48fc87bc235f7e214acf696ca5abc0a986f16 # v6
        if: always() && steps.db_tests.outcome != 'skipped'
        with:
          report_paths: 'test-results.xml'
          detailed_summary: true
          include_passed: true
      - name: Upload Database Artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always() && steps.db_tests.outcome != 'skipped'
        with:
          name: database-results
          path: test-results.xml

  security-scan:
    name: 🔍 Secret Scan (TruffleHog)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          fetch-depth: 0
      - name: TruffleHog OSS
        uses: trufflesecurity/trufflehog@d201e543053f24f8edbc1caab9eb63f57d95714d # v3.82.0
        with:
          path: ./
          base: ${{ github.event.before || '' }}
          head: HEAD
          extra_args: --only-verified

  e2e-build:
    name: 🏗️ E2E Static Site Build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: '24'
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.3.14'
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Verify local config never targets PROD
        # smoke.spec.ts is reserved for a deployed URL: the local config must point at
        # localhost and exclude it. Real check, not trust in the YAML.
        run: |
          bun -e "
            import('./playwright.local.config.ts').then((m) => {
              const url = m.default.use.baseURL;
              const ignored = m.default.testIgnore ?? [];
              console.log('Resolved baseURL:', url, '· testIgnore:', ignored);
              if (!url.includes('localhost')) {
                console.error('FATAL: baseURL does not resolve to localhost.');
                process.exit(1);
              }
              if (!ignored.some((p) => String(p).includes('smoke.spec.ts'))) {
                console.error('FATAL: smoke.spec.ts is not excluded.');
                process.exit(1);
              }
            });
          "
      - name: Build static export (out/) with the E2E catalog fixture
        # FC 008: three fictitious e2e- products, canonical row 485000 MXN / 18.5000 → 26216 USD.
        # Built once for the three browsers (FC 026); only tested, never deployed.
        env:
          CATALOG_FIXTURE: e2e/fixtures/catalog.json
        run: bun run build
      - name: Upload the static site
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: e2e-static-out
          path: out/
          # out/.htaccess carries the rewrite rules and the CSP the suites check.
          include-hidden-files: true
          retention-days: 1

  site-build:
    name: 🏗️ Production Site Build
    # FC 026 Enmienda 10: the production site is built at t = 0, from the live API, and handed to
    # the deploy as an artifact; the deploy only waits for the released API and syncs.
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: '24'
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.3.14'
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Build static export (out/)
        # FC 008/009: the catalog is always read from apiv1.yekora.mx; a failed read fails the
        # build and the previous deploy stays online.
        env:
          CATALOG_API_URL: https://apiv1.yekora.mx
        run: bun run build
      - name: Upload the production site
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: prod-static-out
          path: out/
          # out/.htaccess carries the rewrite rules, the CSP and the hardening headers.
          include-hidden-files: true
          retention-days: 1

  e2e-validation:
    name: 🧪 E2E (${{ matrix.project }} · ${{ matrix.shard }})
    needs: [e2e-build]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # Desktop Chrome, iPhone (WebKit) and Android (Chrome on a phone): playwright.local.config.ts.
        # FC 026 Enmienda 10: WebKit is the slowest engine, so it gets four shards (stable run of
        # acdf515: 70 s of tests per shard with three); the Chromium projects get two each.
        include:
          - { project: 'chromium', shard: '1/2' }
          - { project: 'chromium', shard: '2/2' }
          - { project: 'webkit', shard: '1/4' }
          - { project: 'webkit', shard: '2/4' }
          - { project: 'webkit', shard: '3/4' }
          - { project: 'webkit', shard: '4/4' }
          - { project: 'mobile-chrome', shard: '1/2' }
          - { project: 'mobile-chrome', shard: '2/2' }
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: '24'
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.3.14'
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Download the static site
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: e2e-static-out
          path: out
      - name: Serve out/ with Apache (httpd 2.4 + mod_rewrite + .htaccess, as on Hostinger)
        # The suites run against what Hostinger serves, not the dev server (FC 003 F2).
        run: |
          docker run -d --name yekora-httpd -p 3100:80             -v "$PWD/out:/usr/local/apache2/htdocs:ro"             -v "$PWD/e2e/apache/yekora.conf:/usr/local/apache2/conf/extra/yekora.conf:ro"             httpd:2.4             sh -c 'echo "Include conf/extra/yekora.conf" >> conf/httpd.conf && exec httpd-foreground'
          # Up to 60 s for Apache; the last curl, outside the loop, fails the step if it never answered.
          for attempt in $(seq 1 30); do curl -fsS http://localhost:3100 --connect-timeout 5 --max-time 10 > /dev/null && break; sleep 2; done; curl -fsS http://localhost:3100 --connect-timeout 5 --max-time 10 > /dev/null
      - name: Playwright version for the browser cache key
        # FC 026 Enmienda 9: the key follows Playwright only, not every change of bun.lock.
        run: node -p "require('./package.json').devDependencies['@playwright/test']" > .playwright-version
      - name: Cache Playwright browsers
        id: pw_cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('.playwright-version') }}
      - name: Cache WebKit's system packages (apt)
        # FC 026 Enmienda 10: the stable run spent 41 s installing WebKit's Linux libraries. The
        # .deb files are kept between runs; dpkg still installs them, but nothing is downloaded.
        if: matrix.project == 'webkit'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /home/runner/apt-cache
          key: ${{ runner.os }}-webkit-apt-${{ hashFiles('.playwright-version') }}
      - name: Restore WebKit's system packages into apt's archive
        if: matrix.project == 'webkit'
        # An empty cache (first run) has no .deb to copy: that is not an error.
        run: |
          mkdir -p /home/runner/apt-cache
          sudo cp -n /home/runner/apt-cache/*.deb /var/cache/apt/archives/ 2> /dev/null || true
      - name: Install both engines (download only when the cache missed)
        # One key for every lane: whichever lane fills it stores Chromium and WebKit together.
        if: steps.pw_cache.outputs.cache-hit != 'true'
        run: bunx playwright install --with-deps chromium webkit
      - name: Install this lane's system libraries, and its browser if the cache lacks it (cache hit)
        # The key reads the declared range; if the lockfile moved Playwright within it, `install`
        # fetches the matching browser (a no-op when it is already there), so a stale cache never
        # breaks E2E.
        if: steps.pw_cache.outputs.cache-hit == 'true'
        run: bunx playwright install --with-deps ${{ matrix.project == 'webkit' && 'webkit' || 'chromium' }}
      - name: Keep WebKit's system packages for the next run
        if: matrix.project == 'webkit'
        run: |
          sudo cp -n /var/cache/apt/archives/*.deb /home/runner/apt-cache/ 2> /dev/null || true
          sudo chown -R runner:docker /home/runner/apt-cache
      - name: Run Playwright E2E and WCAG audit (content, RWD gate, .htaccess, axe)
        env:
          E2E_APACHE: '1'
        run: bunx playwright test --config=playwright.local.config.ts --project=${{ matrix.project }} --shard=${{ matrix.shard }}
      - name: Apache logs
        if: failure()
        run: docker logs yekora-httpd
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          # Artifact names cannot hold the '/' of a shard: the job index tells the seven apart.
          name: playwright-report-${{ matrix.project }}-${{ strategy.job-index }}
          path: playwright-report/
          retention-days: 7

  e2e-stack-validation:
    name: 🧪 E2E · Real Stack (Site + API + MariaDB 11.8.9)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # The whole chain with nothing emulated: MariaDB as production, the real API, the site built
    # from it and served by Apache. No processor keys: a checkout ends in the API's 503.
    services:
      mariadb:
        image: mariadb:11.8.9
        env:
          MARIADB_ROOT_PASSWORD: ci-only-root
          MARIADB_DATABASE: yekora_ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=24
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: '3306'
      DB_USER: root
      DB_PASSWORD: ci-only-root
      DB_NAME: yekora_ci
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: '24'
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.3.14'
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Migrations and the E2E seed (catalog, stock, FIX, shipping tables)
        run: |
          set -euo pipefail
          bun scripts/migrateDb.ts
          bun scripts/seedE2eStack.ts
      - name: Start the real API and check its health
        run: |
          set -euo pipefail
          PORT=3001 HOST=127.0.0.1 nohup bun apps/api/src/server.ts > api.log 2>&1 &
          for attempt in $(seq 1 30); do
            curl --connect-timeout 5 --max-time 10 -fsS http://127.0.0.1:3001/health > /dev/null 2>&1 && break
            sleep 1
          done
          curl --connect-timeout 5 --max-time 10 -fsS http://127.0.0.1:3001/health | jq -e '.status == "ok" and .db == "connected"'
      - name: Build static export (out/) from the real API
        env:
          CATALOG_API_URL: http://127.0.0.1:3001
        run: bun run build
      - name: Serve out/ with Apache (httpd 2.4 + mod_rewrite + .htaccess, as on Hostinger)
        # The suites run against what Hostinger serves, not the dev server (FC 003 F2).
        run: |
          docker run -d --name yekora-httpd -p 3100:80             -v "$PWD/out:/usr/local/apache2/htdocs:ro"             -v "$PWD/e2e/apache/yekora.conf:/usr/local/apache2/conf/extra/yekora.conf:ro"             httpd:2.4             sh -c 'echo "Include conf/extra/yekora.conf" >> conf/httpd.conf && exec httpd-foreground'
          # Up to 60 s for Apache; the last curl, outside the loop, fails the step if it never answered.
          for attempt in $(seq 1 30); do curl -fsS http://localhost:3100 --connect-timeout 5 --max-time 10 > /dev/null && break; sleep 2; done; curl -fsS http://localhost:3100 --connect-timeout 5 --max-time 10 > /dev/null
      - name: Playwright version for the browser cache key
        # FC 026 Enmienda 9: the key follows Playwright only, not every change of bun.lock.
        run: node -p "require('./package.json').devDependencies['@playwright/test']" > .playwright-version
      - name: Cache Playwright browsers
        id: pw_cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('.playwright-version') }}
      - name: Install both engines (download only when the cache missed)
        # One key for every lane: whichever lane fills it stores Chromium and WebKit together.
        if: steps.pw_cache.outputs.cache-hit != 'true'
        run: bunx playwright install --with-deps chromium webkit
      - name: Install this lane's system libraries, and its browser if the cache lacks it (cache hit)
        # The key reads the declared range; if the lockfile moved Playwright within it, `install`
        # fetches the matching browser (a no-op when it is already there), so a stale cache never
        # breaks E2E.
        if: steps.pw_cache.outputs.cache-hit == 'true'
        run: bunx playwright install --with-deps chromium
      - name: Run the real-stack suite (catalog, cart quote, shipping, checkout)
        run: bunx playwright test --config=playwright.stack.config.ts
      - name: API and Apache logs
        if: failure()
        run: |
          cat api.log
          docker logs yekora-httpd
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: playwright-stack-report
          path: playwright-stack-report/
          retention-days: 7

  sonar-scan:
    name: 🔍 SonarQube Quality Gate
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: '24'
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.3.14'
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Generate coverage (lcov)
        run: bun run test:coverage
      - name: SonarQube Cloud Scan
        uses: SonarSource/sonarqube-scan-action@713881670b6b3676cda39549040e2d88c70d582e # v8.2.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io
      - name: SonarQube Quality Gate Check
        uses: SonarSource/sonarqube-quality-gate-action@cf038b0e0cdecfa9e56c198bbb7d21d751d62c3b # v1.2.0
        timeout-minutes: 5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io
      - name: SonarSpotless (A/A/A · 0 issues · coverage 100 · dup 0 · hotspots 100)
        # Free plan cannot assign the custom gate: this guard enforces the bar. No if-guard.
        run: node tools/verify-sonar-spotless.mjs
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io

  global-certification:
    name: 🔱 Yekora Global Certification
    needs:
      [
        static-analysis,
        dependency-audit,
        frontend-validation,
        tooling-validation,
        backend-validation,
        database-validation,
        security-scan,
        e2e-validation,
        e2e-stack-validation,
        sonar-scan,
      ]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          # Gate 2 needs the base commit locally for `git diff base head`.
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: '24'
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.3.14'
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Download the test results of each job
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: all-results
          # frontend-, tooling-, backend- and database-results, and tsc-result; not the static site.
          pattern: '*result*'
      - name: Run A03/A04/A06/A08 real checks (OWASP evidence, no fixed text)
        id: owasp_scripts
        # Exit codes feed the dashboard, which fails the job on any red or missing one (T1.4).
        run: |
          set +e
          bun scripts/checkNoRawSql.ts
          echo "a03=$?" >> "$GITHUB_OUTPUT"
          bun scripts/checkSecureDesignGates.ts
          echo "a04=$?" >> "$GITHUB_OUTPUT"
          bun scripts/dependencyAuditGate.ts
          echo "a06=$?" >> "$GITHUB_OUTPUT"
          bun scripts/checkPipelineIntegrity.ts
          echo "a08=$?" >> "$GITHUB_OUTPUT"
      - name: DC4 — Dead Exports Guard (blocking)
        run: bun scripts/checkDeadExports.ts
      - name: ADR 0007 — No ENUM/SET in migrations (blocking)
        run: bun scripts/checkNoEnum.ts
      - name: Gate 2 — Diff-Scoped Quality (blocking)
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
            HEAD="${{ github.event.pull_request.head.sha }}"
          else
            BASE="${{ github.event.before }}"
            HEAD="${{ github.sha }}"
          fi
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            echo "No valid base ref (initial push or edge case) -- Gate 2 skipped this run."
            exit 0
          fi
          bun scripts/checkDiffQuality.ts --base "$BASE" --head "$HEAD"
      - name: Generate Certification Dashboard
        env:
          STATIC_RESULT: ${{ needs.static-analysis.result }}
          AUDIT_RESULT: ${{ needs.dependency-audit.result }}
          FRONTEND_RESULT: ${{ needs.frontend-validation.result }}
          TOOLING_RESULT: ${{ needs.tooling-validation.result }}
          BACKEND_RESULT: ${{ needs.backend-validation.result }}
          DB_RESULT: ${{ needs.database-validation.result }}
          E2E_RESULT: ${{ needs.e2e-validation.result }}
          E2E_STACK_RESULT: ${{ needs.e2e-stack-validation.result }}
          SONAR_RESULT: ${{ needs.sonar-scan.result }}
          SECURITY_RESULT: ${{ needs.security-scan.result }}
          A03_EXIT: ${{ steps.owasp_scripts.outputs.a03 }}
          A04_EXIT: ${{ steps.owasp_scripts.outputs.a04 }}
          A06_EXIT: ${{ steps.owasp_scripts.outputs.a06 }}
          A08_EXIT: ${{ steps.owasp_scripts.outputs.a08 }}
        run: bun scripts/generateCertificationDashboard.ts all-results >> "$GITHUB_STEP_SUMMARY"

  api-release:
    name: 📦 API release (apiv1.yekora.mx)
    # FC 008 F5 · R2: the CI is the only compiler. The certified, self-contained bundle goes to
    # the api-release branch, which Hostinger's Node.js app tracks; Hostinger never installs or
    # builds anything. /health reports the stamped commit, so the smoke test proves what runs.
    needs: [global-certification]
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    concurrency:
      group: api-release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.3.14'
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Build the certified bundle (stamped with this commit)
        run: bun run --cwd apps/api build
      - name: Publish to the api-release branch
        # A worktree shares the checkout credentials; the branch holds only index.js and its
        # dependency-free package.json, one commit per release.
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if git ls-remote --exit-code --heads origin api-release > /dev/null; then
            git fetch --depth=1 origin api-release
            git worktree add --detach release origin/api-release
          else
            git worktree add --detach release
            git -C release checkout --orphan api-release-init
            git -C release rm -rfq .
          fi
          find release -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp apps/api/dist/index.js apps/api/dist/package.json release/
          git -C release add -A
          # A re-run of the same commit rebuilds identical bytes: already published, not an error.
          if git -C release diff --cached --quiet; then
            echo "[OK] api-release already holds $GITHUB_SHA (re-run): nothing to publish"
            exit 0
          fi
          git -C release commit -qm "API release $GITHUB_SHA"
          git -C release push origin HEAD:refs/heads/api-release
          echo "[OK] api-release ← $GITHUB_SHA"
      - name: 🔥 Smoke test — apiv1.yekora.mx serves this commit
        # FC 009 F0 · K-13: unconditional (the F5 bootstrap switch API_LIVE is gone; the A08 gate
        # fails if it ever comes back). FC 026 Enmienda 9: a 300 s deadline polled every 3 s, every
        # curl bounded; on timeout it prints DNS and IPv4/IPv6 reachability, so a blocked runner,
        # an IPv6 route and a down server read differently (run 41248127975 hung 73 min blind).
        # FC 039 (270_AN): this commit, healthy and with its database, in one condition. Waiting for
        # the sha alone let a restart's 503 (pool not connected yet) fail the next check.
        run: |
          set -uo pipefail
          DEADLINE=$((SECONDS + 300))
          until [ "$(curl --connect-timeout 5 --max-time 10 -fsS "https://apiv1.yekora.mx/health" | jq -r 'select(.status == "ok" and .db == "connected") | .sha' 2> /dev/null)" = "$GITHUB_SHA" ]; do
            if [ "$SECONDS" -ge "$DEADLINE" ]; then
              echo "FATAL: apiv1.yekora.mx does not run $GITHUB_SHA after 300 s. Network diagnosis:"
              getent ahosts apiv1.yekora.mx || echo "DNS: no answer"
              curl -4 -v --connect-timeout 5 --max-time 10 -o /dev/null https://apiv1.yekora.mx/health || echo "IPv4: unreachable"
              curl -6 -v --connect-timeout 5 --max-time 10 -o /dev/null https://apiv1.yekora.mx/health || echo "IPv6: unreachable"
              exit 1
            fi
            sleep 3
          done
          echo "[OK] apiv1.yekora.mx runs $GITHUB_SHA after ${SECONDS} s"
          curl --connect-timeout 5 --max-time 10 -fsS https://apiv1.yekora.mx/health | jq -e '.status == "ok" and .db == "connected"'
          curl --connect-timeout 5 --max-time 10 -fsS https://apiv1.yekora.mx/v1/catalog | jq -e '.items | type == "array"' > /dev/null
          # A Banxico FIX is stored since 2026-10-19: a 503 here would mean the rates were lost.
          RATE=$(curl --connect-timeout 5 --max-time 10 -sS -o /dev/null -w '%{http_code}' https://apiv1.yekora.mx/v1/exchange-rate)
          [ "$RATE" = "200" ] || { echo "FATAL: /v1/exchange-rate → $RATE"; exit 1; }
          # FC 009 F4: the cart quote answers the empty cart with a zeroed summary.
          curl --connect-timeout 5 --max-time 10 -fsS -X POST https://apiv1.yekora.mx/v1/cart/quote \
            -H 'Content-Type: application/json' -H 'Origin: https://yekora.mx' \
            -d '{"items":[]}' \
            | jq -e '.items == [] and .warnings == [] and .summary.totalMxnCents == 0 and .summary.subtotalMxnCents == 0 and .summary.taxMxnCents == 0' > /dev/null \
            || { echo "FATAL: /v1/cart/quote does not quote the empty cart"; exit 1; }
          # FC 011: an unknown SKU makes the quote read products with the physical columns of
          # migration 002 (a missing column is a 500). Without a destination it is a 200 with an
          # `unavailable` warning; with one, T1.1 V refuses it with a 400 problem.
          curl --connect-timeout 5 --max-time 10 -fsS -X POST https://apiv1.yekora.mx/v1/cart/quote \
            -H 'Content-Type: application/json' -H 'Origin: https://yekora.mx' \
            -d '{"items":[{"sku":"SMOKE-NONE","quantity":1}]}' \
            | jq -e '.warnings == [{"sku":"SMOKE-NONE","code":"unavailable"}] and .summary.shippingCode == null and .summary.serviceable == true' > /dev/null \
            || { echo "FATAL: /v1/cart/quote without destination"; exit 1; }
          SHIP=$(curl --connect-timeout 5 --max-time 10 -sS -o /tmp/ship.json -w '%{http_code}' -X POST https://apiv1.yekora.mx/v1/cart/quote \
            -H 'Content-Type: application/json' -H 'Origin: https://yekora.mx' \
            -d '{"items":[{"sku":"SMOKE-NONE","quantity":1}],"destination":{"stateCode":"ZAC"}}')
          [ "$SHIP" = "400" ] && jq -e '.detail == "EMPTY_OR_UNAVAILABLE_CART"' /tmp/ship.json > /dev/null \
            || { echo "FATAL: /v1/cart/quote with destination → $SHIP $(cat /tmp/ship.json)"; exit 1; }
          echo "[OK] apiv1.yekora.mx runs $GITHUB_SHA · db connected · catalog OK · exchange-rate 200 · cart quote OK · shipping quote OK"

  hostinger-deployment:
    name: 🚀 Deployment to Hostinger
    # Only certified pushes to main reach production (FC 003). Hostinger's own Git
    # auto-deployment stays off: this job is the only way in. FC 026 Enmienda 10: the site comes
    # built from site-build; this job waits for apiv1.yekora.mx to serve this commit before the
    # rsync, so the order API → site holds without paying the two in series.
    needs: [global-certification, site-build]
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # One deploy at a time; a newer push waits instead of cutting an rsync in half.
    concurrency:
      group: hostinger-production
      cancel-in-progress: false
    env:
      # Secrets reach the scripts as variables, never pasted into the script text.
      SSH_HOST: ${{ secrets.SSH_HOST }}
      SSH_PORT: ${{ secrets.SSH_PORT }}
      SSH_USERNAME: ${{ secrets.SSH_USERNAME }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          # The full history lets the rebuild step compare this push with the previous one.
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: '24'
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.3.14'
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Download the production site built at t = 0
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: prod-static-out
          path: out
      # 282_AN (run 41892573422): Hostinger once took over 120 s to publish the API, and the site
      # waited no longer; 300 s, the same deadline as the API smoke.
      - name: ⏱️ Wait for the API release — apiv1.yekora.mx serves this commit (≤ 300 s)
        run: |
          set -uo pipefail
          DEADLINE=$((SECONDS + 300))
          until [ "$(curl --connect-timeout 5 --max-time 10 -fsS https://apiv1.yekora.mx/health | jq -r 'select(.status == "ok" and .db == "connected") | .sha' 2> /dev/null)" = "$GITHUB_SHA" ]; do
            if [ "$SECONDS" -ge "$DEADLINE" ]; then
              echo "FATAL: apiv1.yekora.mx does not serve $GITHUB_SHA after 300 s; the site is not deployed."
              exit 1
            fi
            sleep 3
          done
          echo "[OK] apiv1.yekora.mx serves $GITHUB_SHA"
      - name: Rebuild against the released API when this commit changed apps/api
        # The early build read the previous API. When this push changed the API, the catalog is
        # read again from the one just released; otherwise the early build is the same and stays.
        env:
          CATALOG_API_URL: https://apiv1.yekora.mx
          BEFORE: ${{ github.event.before }}
        run: |
          if [ -n "$BEFORE" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ] \
            && git cat-file -e "$BEFORE^{commit}" 2> /dev/null \
            && git diff --quiet "$BEFORE" "$GITHUB_SHA" -- apps/api; then
            echo "[OK] apps/api unchanged since $BEFORE: the early build stays."
          else
            echo "apps/api changed (or no comparable base): rebuilding against the released API."
            bun run build
          fi
      - name: 🛡️ A1 guard — no fictitious product reaches production
        # FC 008 Does NOT: fictitious products in production. E2E fixture slugs start with e2e-
        # and local seed slugs with dev-; either one in out/ aborts the deploy.
        run: |
          leaked=$(find out/catalogo out/en/catalog -mindepth 1 -maxdepth 1 -type d \( -name 'e2e-*' -o -name 'dev-*' \) 2>/dev/null)
          if [ -n "$leaked" ]; then
            echo "FATAL: fictitious product pages in out/:"
            echo "$leaked"
            exit 1
          fi
          echo "OK: no fictitious product page in out/"
      - name: Stamp the build with its commit (out/version.txt, out/sw.js)
        # FC 007: the service worker only updates in browsers when its bytes change, so the
        # commit SHA replaces the __BUILD_SHA__ marker; its cache name changes on every deploy.
        run: |
          printf '%s\n' "$GITHUB_SHA" > out/version.txt
          sed -i "s/__BUILD_SHA__/$GITHUB_SHA/g" out/sw.js
          if grep -q '__BUILD_SHA__' out/sw.js || ! grep -q "$GITHUB_SHA" out/sw.js; then
            echo "FATAL: out/sw.js was not stamped with $GITHUB_SHA"
            exit 1
          fi

      - name: 🔑 Setup SSH key and pinned host key
        # known_hosts comes only from the secret, never from scanning the host. A host key that does
        # not match aborts every connection below (StrictHostKeyChecking=yes).
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/yekora_deploy
          chmod 600 ~/.ssh/yekora_deploy
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts
          echo "SSH_CMD=ssh -p $SSH_PORT -i $HOME/.ssh/yekora_deploy -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=30" >> "$GITHUB_ENV"

      - name: 🛡️ A1 probe — the key only reaches yekora.mx/public_html
        # The account is shared with Archon (production). The key must be confined by rrsync
        # to domains/yekora.mx/public_html: no shell, and no way above that folder.
        run: |
          if $SSH_CMD "$SSH_USERNAME@$SSH_HOST" 'ls ~' > /dev/null 2>&1; then
            echo "FATAL A1: the deploy key opens a shell on the account. Restrict it with rrsync."
            exit 1
          fi
          rsync --list-only -e "$SSH_CMD" "$SSH_USERNAME@$SSH_HOST:./" > /dev/null
          # rrsync either refuses these paths or maps them back inside public_html; seeing
          # public_html, domains or home in the listing means the key escaped.
          for outside in '../' '/'; do
            LISTING=$(rsync --list-only -e "$SSH_CMD" "$SSH_USERNAME@$SSH_HOST:$outside" 2>/dev/null || true)
            if printf '%s\n' "$LISTING" | grep -qE '[[:space:]](public_html|domains|home)/?$'; then
              echo "FATAL A1: the deploy key can list '$outside' above public_html. Restrict it with rrsync."
              exit 1
            fi
          done
          echo "[OK] A1 key confined: no shell, rsync only inside its folder."

      - name: 🚀 Deploy out/ to public_html via rsync
        # Relative destination ./ is the rrsync root (public_html itself, never a nested copy).
        # .well-known/ holds Hostinger's SSL validation and is never touched.
        run: |
          rsync -avz --delete --exclude='.well-known/' \
            -e "$SSH_CMD" \
            ./out/ \
            "$SSH_USERNAME@$SSH_HOST:./"

      - name: 🔥 Smoke test — production serves this commit
        run: |
          # FC 026 Enmienda 9: polled every 3 s up to 120 s, every curl bounded.
          DEADLINE=$((SECONDS + 120))
          until [ "$(curl --connect-timeout 5 --max-time 10 -fsS "https://yekora.mx/version.txt?sha=$GITHUB_SHA" -H 'Cache-Control: no-cache' 2> /dev/null)" = "$GITHUB_SHA" ]; do
            if [ "$SECONDS" -ge "$DEADLINE" ]; then
              echo "FATAL: https://yekora.mx/version.txt does not serve $GITHUB_SHA after 120 s"
              exit 1
            fi
            sleep 3
          done
          for url in https://yekora.mx/ https://yekora.mx/en/ https://yekora.mx/favicon.ico \
            https://yekora.mx/envios-y-devoluciones/ https://yekora.mx/en/shipping-and-returns/ \
            https://yekora.mx/manifest.webmanifest https://yekora.mx/offline/ https://yekora.mx/en/offline/ \
            https://yekora.mx/catalogo/ https://yekora.mx/en/catalog/ https://yekora.mx/carrito/ https://yekora.mx/en/cart/; do
            STATUS=$(curl --connect-timeout 5 --max-time 10 -sS -o /dev/null -w '%{http_code}' "$url")
            echo "$url → $STATUS"
            if [ "$STATUS" != "200" ]; then exit 1; fi
          done
          # FC 007 G1: production must serve the stamped service worker, never the bare marker.
          curl --connect-timeout 5 --max-time 10 -fsS "https://yekora.mx/sw.js?sha=$GITHUB_SHA" -H 'Cache-Control: no-cache' -o /tmp/sw.js
          if grep -q '__BUILD_SHA__' /tmp/sw.js || ! grep -q "$GITHUB_SHA" /tmp/sw.js; then
            echo "FATAL: https://yekora.mx/sw.js does not carry $GITHUB_SHA"
            exit 1
          fi
          # An unknown path must answer 404 with the branded page, never 200 (FC 004).
          NOT_FOUND=$(curl --connect-timeout 5 --max-time 10 -sS -o /tmp/404.html -w '%{http_code}' "https://yekora.mx/ruta-inexistente-$GITHUB_SHA/")
          echo "unknown path → $NOT_FOUND"
          if [ "$NOT_FOUND" != "404" ] || ! grep -q 'Ruta no encontrada' /tmp/404.html; then exit 1; fi
          # FC 010 (OWASP A02/A05): plain HTTP is a 301 to HTTPS (Hostinger's CDN), and the live
          # answer carries HSTS and the hardening headers of public/.htaccess.
          REDIRECT=$(curl --connect-timeout 5 --max-time 10 -sS -o /dev/null -w '%{http_code} %{redirect_url}' http://yekora.mx/catalogo/)
          echo "http://yekora.mx/catalogo/ → $REDIRECT"
          if [ "$REDIRECT" != "301 https://yekora.mx/catalogo/" ]; then exit 1; fi
          curl --connect-timeout 5 --max-time 10 -fsSI https://yekora.mx/ | tr -d '\r' | tr '[:upper:]' '[:lower:]' > /tmp/headers.txt
          for header in \
            'strict-transport-security: max-age=31536000; includesubdomains' \
            'x-content-type-options: nosniff' \
            'referrer-policy: strict-origin-when-cross-origin' \
            'permissions-policy: camera=(), microphone=(), geolocation=()'; do
            grep -qxF "$header" /tmp/headers.txt || { echo "FATAL: missing '$header'"; exit 1; }
          done
          echo "[OK] yekora.mx serves $GITHUB_SHA in Spanish and English, its favicon, the branded 404, HTTPS only and its hardening headers."

      - name: Remove the SSH key from the runner
        if: always()
        run: rm -f ~/.ssh/yekora_deploy
