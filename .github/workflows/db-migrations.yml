# ============================================================
# 🏛️ DB Migrations (PROD) — FC 008 F4 (Archon FC 064 model, adapted)
#
# Applies the pending migrations of migrations/ to Yekora's production MariaDB on Hostinger,
# only when GrayMan (Ω) dispatches it and approves it. Never runs by itself.
#
# T1.2 · MigrationAllowed ⟺ D ∧ E ∧ O ∧ A
#   D = workflow_dispatch on main (the only trigger; checkPipelineIntegrity fails on any other)
#   E = environment production-db with its secrets (checked before connecting)
#   O = GrayMan's approval: production-db has him as required reviewer (GitHub settings)
#   A = actor is the sovereign owner (job `authorize`, on a GitHub-hosted runner, so an
#       unauthorized dispatch never reaches the self-hosted machine)
#
# R1 (public repo + self-hosted runner, accepted by Ω with conditions): the `yekora-db` runner is
# Ω's PC, whose IP is the only one Hostinger Remote MySQL accepts. It is started by hand only to
# migrate and stopped afterwards; fork pull requests need Ω's approval ("Require approval for all
# external contributors"); no other workflow may mention self-hosted (A08 gate).
#
# Same migrator as local development (scripts/migrateDb.ts, T1.3): SHA-256 registry, idempotent,
# aborts on an edited migration before touching anything. Runner prerequisites (as Archon's):
# Git for Windows (bash, gzip) and C:\xampp\mysql\bin (mysqldump) on the PATH. Since FC 010 the
# backup is encrypted by scripts/backupCrypto.ts (AES-256-GCM), not by openssl.
# FC 015 (K-31, Archon's Rule 23): every run, apply or skip, publishes production's schema
# fingerprint (scripts/dbParityCheck.ts, information_schema only) and the migration's counters
# (migrations/NNN_verify.sql), and ends with its T1.2 verdict (M ∧ P ∧ B). Compare locally with
# `bun scripts/dbParityCheck.ts --expect "<md5> (<n> elementos)"`.
# The summary carries aggregate counts only, never data rows. Passwords travel in the
# environment (MYSQL_PWD), never on a command line, and database secrets reach only the steps
# that connect, never checkout, Bun setup or the dependency install.
# ============================================================

name: 🏛️ DB Migrations (PROD)
# Archon's convention: every run is titled with the migration it applies.
run-name: 🏛️ ${{ inputs.migration_file }} · @${{ github.actor }}

on:
  workflow_dispatch:
    inputs:
      migration_file:
        description: 'File in migrations/ (NNN_V<version>_FC<nnn>-F<n>_<YYYYMMDD>_<description>.sql)'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: db-migrations-prod
  cancel-in-progress: false

jobs:
  authorize:
    name: 🔐 Authorize (T1.2 · D ∧ A)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - name: Only GrayMan, only main, only by hand
        env:
          ACTOR: ${{ github.actor }}
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          [ "$EVENT" = "workflow_dispatch" ] || { echo "::error::D: trigger $EVENT is not workflow_dispatch"; exit 1; }
          [ "$REF" = "refs/heads/main" ] || { echo "::error::D: ref $REF is not main"; exit 1; }
          [ "$ACTOR" = "felipemiramontesr" ] || { echo "::error::A: actor $ACTOR is not the sovereign owner"; exit 1; }
          echo "✅ D ∧ A: workflow_dispatch on main by $ACTOR"
      - name: Migration file (T1.3 · F — canonical name, versioned in main)
        # The input only ever travels in a quoted environment variable, never inside the script.
        env:
          MIGRATION_FILE: ${{ inputs.migration_file }}
        run: |
          set -euo pipefail
          case "$MIGRATION_FILE" in
            *[!A-Za-z0-9._-]* | "" ) echo "::error::F: name outside [A-Za-z0-9._-]"; exit 1 ;;
          esac
          CANONICAL='^[0-9]{3}_V[0-9]+\.[0-9]+\.[0-9]+_FC[0-9]{3}-F[0-9]+_[0-9]{8}_[a-z0-9]+(_[a-z0-9]+)*\.sql$'
          [[ "$MIGRATION_FILE" =~ $CANONICAL ]] || { echo "::error::F: not NNN_V<version>_FC<nnn>-F<n>_<YYYYMMDD>_<description>.sql"; exit 1; }
          git ls-files --error-unmatch "migrations/$MIGRATION_FILE" >/dev/null 2>&1 || { echo "::error::F: migrations/$MIGRATION_FILE is not versioned in main"; exit 1; }
          echo "✅ F: $MIGRATION_FILE"

  migrate:
    name: 🏛️ Backup and migrate
    needs: authorize
    runs-on: [self-hosted, yekora-db]
    # O: GrayMan approves this environment before the job starts.
    environment: production-db
    timeout-minutes: 20
    env:
      MIGRATION_FILE: ${{ inputs.migration_file }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.3.14'
      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Environment secrets present (T1.2 · E)
        env:
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT || '3306' }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_BACKUP_ENCRYPTION_KEY: ${{ secrets.DB_BACKUP_ENCRYPTION_KEY }}
        run: |
          set -euo pipefail
          missing=""
          for name in DB_HOST DB_USER DB_PASSWORD DB_NAME DB_BACKUP_ENCRYPTION_KEY; do
            [ -n "${!name:-}" ] || missing="$missing $name"
          done
          [ -z "$missing" ] || { echo "::error::E: production-db is missing:$missing"; exit 1; }
          echo "✅ E: production-db secrets present"

      # FC 015 · its T1.2, letter M: the database answers before anything else is decided. Read-only: it only
      # computes the schema fingerprint (information_schema), which the summary does not show.
      - name: Connect (read-only · FC 015 T1.2 · M)
        id: connect
        env:
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT || '3306' }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_NAME: ${{ secrets.DB_NAME }}
        run: bun scripts/dbParityCheck.ts > /dev/null

      - name: Plan (read-only · T1.3 checksums · FC 015 T1.2 · P)
        id: plan
        env:
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT || '3306' }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_NAME: ${{ secrets.DB_NAME }}
        run: |
          set -euo pipefail
          bun scripts/migrateDb.ts --plan --target "$MIGRATION_FILE" | tee plan.txt
          PENDING=$(sed -n 's/^\[PLAN\] pending=//p' plan.txt)
          echo "tables=$(sed -n 's/^\[PLAN\] tables=//p' plan.txt)" >> "$GITHUB_OUTPUT"
          echo "pending=$PENDING" >> "$GITHUB_OUTPUT"
          # FC 015: a registered migration is a skip; dispatching it is a parity check.
          if [ "$PENDING" = "0" ]; then echo "decision=skip"; else echo "decision=apply"; fi >> "$GITHUB_OUTPUT"

      - name: Encrypted backup (mysqldump → gzip → AES-256-GCM, YEKORA_GCM_V1), verified
        id: backup
        if: steps.plan.outputs.pending != '0'
        env:
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT || '3306' }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_BACKUP_ENCRYPTION_KEY: ${{ secrets.DB_BACKUP_ENCRYPTION_KEY }}
          TABLES: ${{ steps.plan.outputs.tables }}
        run: |
          set -euo pipefail
          FILE="backup_pre_${MIGRATION_FILE%.sql}_$(date -u +%Y%m%dT%H%M%SZ).sql.gz.enc"
          MYSQL_PWD="$DB_PASSWORD" mysqldump -h "$DB_HOST" -P "$DB_PORT" -u "$DB_USER" \
            --single-transaction --routines --triggers "$DB_NAME" \
            | gzip \
            | bun scripts/backupCrypto.ts encrypt --out "$FILE"
          # FC 010 (YekoraALE): authenticated encryption, key from DB_BACKUP_ENCRYPTION_KEY only.
          # Integrity: the GCM tag must verify and the dump must end with mysqldump's completion line.
          bun scripts/backupCrypto.ts decrypt --in "$FILE" --verify \
            || { echo "::error::Backup does not authenticate to a complete dump — nothing was applied"; exit 1; }
          SIZE=$(stat -c%s "$FILE")
          # FC 008: a backup under 1 KB aborts. Only exception: a database with no tables at all
          # (the very first migration), whose complete dump is legitimately tiny.
          if [ "$TABLES" != "0" ] && [ "$SIZE" -lt 1024 ]; then
            echo "::error::Backup suspiciously small (${SIZE} bytes) — nothing was applied"
            exit 1
          fi
          echo "file=$FILE" >> "$GITHUB_OUTPUT"
          echo "size=$SIZE" >> "$GITHUB_OUTPUT"
          echo "✅ Encrypted backup verified: $FILE (${SIZE} bytes, ${TABLES} tables)"

      - name: Upload backup artifact (7 days)
        if: steps.plan.outputs.pending != '0'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ steps.backup.outputs.file }}
          path: ${{ steps.backup.outputs.file }}
          retention-days: 7
          if-no-files-found: error

      # FC 015 T1.2 · B: an apply needs the verified backup; a skip changes nothing and runs only to print the
      # migration's counters (NNN_verify.sql, aggregates only).
      - name: Apply (or skip) and verification counters
        id: apply
        if: steps.plan.outputs.decision == 'skip' || steps.backup.outcome == 'success'
        env:
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT || '3306' }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_NAME: ${{ secrets.DB_NAME }}
        run: |
          set -euo pipefail
          bun scripts/migrateDb.ts --target "$MIGRATION_FILE" | tee apply.txt
          grep '^\[VERIFY\]' apply.txt > counters.txt || true

      - name: Registered in schema_migrations (T1.3 · R)
        id: record
        if: steps.apply.outcome == 'success'
        env:
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT || '3306' }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_NAME: ${{ secrets.DB_NAME }}
        run: |
          set -euo pipefail
          bun scripts/migrateDb.ts --plan --target "$MIGRATION_FILE" | tee verify.txt
          grep -q '^\[PLAN\] pending=0$' verify.txt || { echo "::error::Migration not registered after apply"; exit 1; }
          echo "✅ $MIGRATION_FILE registered with its SHA-256"

      # FC 015 · Archon's Rule 23: production's schema fingerprint, with the same query and code as
      # the local check (scripts/dbParityCheck.ts). Only information_schema; an MD5 and a count.
      # Runs on apply and on skip, so dispatching a registered migration is a parity check.
      - name: Schema fingerprint (Rule 23 · aggregate hash only)
        id: fingerprint
        if: always() && steps.connect.outcome == 'success' && steps.plan.outcome == 'success' && steps.apply.outcome != 'failure'
        env:
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT || '3306' }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_NAME: ${{ secrets.DB_NAME }}
        run: |
          set -euo pipefail
          LINE=$(bun scripts/dbParityCheck.ts)
          HASH=${LINE%% *}
          COUNT=${LINE#* (}; COUNT=${COUNT% elementos)}
          case "$HASH" in *[!0-9a-f]* | "" ) echo "::error::Unexpected fingerprint"; exit 1 ;; esac
          case "$COUNT" in *[!0-9]* | "" ) echo "::error::Unexpected fingerprint"; exit 1 ;; esac
          echo "hash=$HASH" >> "$GITHUB_OUTPUT"
          echo "elements=$COUNT" >> "$GITHUB_OUTPUT"
          echo "✅ Huella de esquema PROD: $HASH ($COUNT elementos)"

      - name: Summary (aggregates only · FC 015 T1.2 verdict)
        if: always()
        env:
          AUTHORIZE: ${{ needs.authorize.result }}
          CONNECT: ${{ steps.connect.outcome }}
          PLAN: ${{ steps.plan.outcome }}
          DECISION: ${{ steps.plan.outputs.decision }}
          BACKUP: ${{ steps.backup.outcome }}
          BACKUP_FILE: ${{ steps.backup.outputs.file }}
          BACKUP_SIZE: ${{ steps.backup.outputs.size }}
          APPLY: ${{ steps.apply.outcome }}
          RECORD: ${{ steps.record.outcome }}
          FINGERPRINT: ${{ steps.fingerprint.outcome }}
          HASH: ${{ steps.fingerprint.outputs.hash }}
          ELEMENTS: ${{ steps.fingerprint.outputs.elements }}
          ACTOR: ${{ github.actor }}
        run: |
          set -uo pipefail
          # FC 015 T1.2 is decided by the tested pure gate (scripts/lib/dbParity.ts), not re-written in bash.
          VERDICT=$(bun -e 'import { workflowVerdict } from "./scripts/lib/dbParity.ts"; const e = process.env; console.log(workflowVerdict({ connect: e.CONNECT ?? "", plan: e.PLAN ?? "", decision: e.DECISION ?? "", backup: e.BACKUP ?? "", apply: e.APPLY ?? "", fingerprint: e.FINGERPRINT ?? "" }))' 2>/dev/null || echo "DB_CONNECTION_FAILED")
          {
            echo "### 🏛️ DB Migration — $MIGRATION_FILE"
            echo ""
            echo "| Campo | Valor |"
            echo "| :--- | :--- |"
            echo "| Migración | \`$MIGRATION_FILE\` |"
            echo "| Validación (T1.3 · F) | ${AUTHORIZE} |"
            echo "| Registro (T1.3) | ${PLAN:-n/a} — decisión \`${DECISION:-n/a}\` |"
            echo "| Backup cifrado (FC 015 T1.2 · B) | ${BACKUP:-skipped} — \`${BACKUP_FILE:-n/a}\` (${BACKUP_SIZE:-0} bytes) |"
            echo "| Aplicación | ${APPLY:-skipped} |"
            echo "| Registrada en schema_migrations | ${RECORD:-skipped} |"
            echo "| Huella de esquema PROD (Regla 23) | \`${HASH:-n/a}\` (${ELEMENTS:-0} elementos) — comparar: \`bun scripts/dbParityCheck.ts --expect \"<huella>\"\` |"
            echo "| Veredicto (FC 015 T1.2) | \`$VERDICT\` |"
            echo "| Actor | ${ACTOR} |"
            echo ""
            if [ -s counters.txt ]; then
              echo "#### Verificación (contadores agregados de la migración)"
              echo '```'
              cat counters.txt
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          [ "$VERDICT" = "FINGERPRINT_PUBLISHED" ]
