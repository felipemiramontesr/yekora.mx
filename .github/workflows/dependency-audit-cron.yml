name: 🛡️ Dependency Audit (daily)

# FC 016 (K-32, Archon parity) · Preventive daily audit of the supply chain. It runs the same gate
# as the product CI (`scripts/dependencyAuditGate.ts`: critical = 0 ∧ high = 0, unknown severity
# counted as high) to catch a new advisory before it blocks a delivery, as one did on
# 2026-10-26 (deploy 40388948104). On failure it opens (or comments) one Issue labelled
# `security`, which notifies GrayMan by e-mail; Charlie transcribes it to channel H.
# Procedure and deadlines: docs/security/dependency-triage.md
#
# Public runner only (never self-hosted, A08 e); every action pinned by full SHA (A08,
# scripts/lib/workflowGuards.ts). Read-only checkout; `issues: write` only for this job.

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: 🛡️ Security Audit (critical=0 ∧ high=0)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.3.14'
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Security Audit (blocking — critical=0 ∧ high=0)
        run: bun scripts/dependencyAuditGate.ts
      - name: Open or update the security issue
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          TITLE="Aviso de seguridad en dependencias (auditoría diaria)"
          BODY="La auditoría diaria encontró avisos critical o high. Ejecución: ${RUN_URL}. Atender según docs/security/dependency-triage.md (crítica ≤ 24 h, alta ≤ 72 h, moderada o baja ≤ 7 días)."
          gh label create security --color B60205 --description "Avisos de seguridad" --force
          NUMBER=$(gh issue list --label security --state open --search "in:title \"${TITLE}\"" --json number --jq '.[0].number // empty')
          if [ -n "${NUMBER}" ]; then
            gh issue comment "${NUMBER}" --body "${BODY}"
          else
            gh issue create --title "${TITLE}" --label security --body "${BODY}"
          fi
