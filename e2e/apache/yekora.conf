# CI only (FC 003 F2): makes the stock httpd:2.4 image behave like Hostinger for out/.
# mod_rewrite on and .htaccess allowed, so the E2E suite runs against public/.htaccess as deployed.
LoadModule rewrite_module modules/mod_rewrite.so
# FC 007: Cache-Control on sw.js and the manifest (public/.htaccess). Loaded only if the image
# does not load it already.
<IfModule !headers_module>
    LoadModule headers_module modules/mod_headers.so
</IfModule>

<Directory "/usr/local/apache2/htdocs">
    AllowOverride All
</Directory>
